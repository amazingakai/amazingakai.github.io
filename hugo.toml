title = 'Azhar Momin'
locale = 'en-US'
enableRobotsTXT = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[params]
  summaryLength = 1
  description = "I'm a computer science student interested in low level programming, distributed systems, and observability tooling. I write mostly C++, Rust, Go, and Python."

[params.author]
  name = 'Azhar Momin'

[params.rtwt]
  sidePane = true
  countPageItems = 7
  searchPath = 'search'

[params.rtwt.home]
  sidePaneTags = true
  showFeatured = true
  hideRecentWhenFeatured = true
  showRecent = true
  countRecent = 5

[params.rtwt.side.home]
  sidePaneSticky = false
  taxonomies = []

[params.rtwt.side.list]
  sidePaneSticky = false

[params.rtwt.side.single]
  sidePaneSticky = true
  showDetails = true
  showTableOfContents = true
  showAttachments = true
  showRelated = true
  countRelated = 5

[related]
  includeNewer = true
  [[related.indices]]
    name = 'tags'
    weight = 100

[taxonomies]
  tag = 'tags'

[[menus.main]]
  name = 'Posts'
  pageRef = '/posts'
  weight = 1

[[menus.main]]
  name = 'Contact'
  url = 'mailto:azharmomin@proton.me'
  weight = 2

[outputFormats]
  [outputFormats.SearchIndex]
    mediaType = "application/json"
    baseName = "searchindex"
    isPlainText = true
    notAlternative = true

[mediaTypes]
  [mediaTypes."application/json"]
    suffixes = ["json"]

[outputs]
  home = ["HTML", "RSS", "SearchIndex"]
