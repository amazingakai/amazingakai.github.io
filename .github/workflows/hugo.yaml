name: Build and deploy
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: pages
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      base_url: ${{ steps.pages.outputs.base_url }}
    env:
      DART_SASS_VERSION: 1.99.0
      GO_VERSION: 1.26.1
      HUGO_VERSION: 0.160.0
      NODE_VERSION: 24.14.1
      TZ: Europe/Oslo
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Create directory for user-specific executable files
        run: |
          mkdir -p "${HOME}/.local"
      - name: Install Dart Sass
        run: |
          curl -sLJO "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -C "${HOME}/.local" -xf "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          rm "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"
      - name: Install Hugo
        run: |
          curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          rm "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"
      - name: Verify installations
        run: |
          echo "Dart Sass: $(sass --version)"
          echo "Go: $(go version)"
          echo "Hugo: $(hugo version)"
          echo "Node.js: $(node --version)"
      - name: Install Node.js dependencies
        run: |
          [[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true
      - name: Configure Git
        run: |
          git config core.quotepath false
      - name: Cache restore
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ github.run_id }}
          restore-keys:
            hugo-
      - name: Build main site
        run: |
          hugo build \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${{ runner.temp }}/hugo_cache"
      - name: Get open PRs
        id: get-prs
        uses: actions/github-script@v7
        with:
          script: |
            const closedPr = context.eventName === 'pull_request' && context.event.action === 'closed'
              ? context.payload.pull_request.number
              : null;
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            return pulls
              .filter(p => p.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`)
              .filter(p => p.number !== closedPr)
              .map(p => p.number)
              .join(',');
      - name: Build PR previews
        if: steps.get-prs.outputs.result != ''
        run: |
          IFS=',' read -ra PRS <<< "${{ steps.get-prs.outputs.result }}"
          for PR_NUMBER in "${PRS[@]}"; do
            echo "::group::Building preview for PR #${PR_NUMBER}"
            git fetch origin "pull/${PR_NUMBER}/head:pr-${PR_NUMBER}"
            git stash --include-untracked
            git checkout "pr-${PR_NUMBER}"
            hugo build \
              --gc \
              --minify \
              --baseURL "${{ steps.pages.outputs.base_url }}/pulls/${PR_NUMBER}/" \
              --destination "${{ runner.temp }}/preview-${PR_NUMBER}" \
              --cacheDir "${{ runner.temp }}/hugo_cache"
            mkdir -p "public/pulls/${PR_NUMBER}"
            cp -r "${{ runner.temp }}/preview-${PR_NUMBER }}"/* "public/pulls/${PR_NUMBER}/"
            git checkout -
            git stash pop || true
            echo "::endgroup::"
          done
      - name: Cache save
        id: cache-save
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
  comment:
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [build, deploy]
    steps:
      - name: Find existing comment
        id: find-comment
        uses: actions/github-script@v7
        with:
          result-encoding: json
          script: |
            const marker = '<!-- pr-preview -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            return { comment_id: existing ? existing.id : null };
      - name: Comment on PR
        if: github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-preview -->';
            const buildOk = '${{ needs.build.result }}' === 'success';
            const deployOk = '${{ needs.deploy.result }}' === 'success';
            const prNumber = context.issue.number;
            let body;
            if (buildOk && deployOk) {
              const baseUrl = '${{ needs.build.outputs.base_url }}';
              body = `${marker}\n🚀 **Preview deployment:** ${baseUrl}/pulls/${prNumber}/`;
            } else {
              body = `${marker}\n❌ **Preview deployment failed.** [View workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            }
            const commentId = ${{ fromJson(steps.find-comment.outputs.result).comment_id }};
            if (commentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body,
              });
            }
      - name: Remove comment on PR close
        if: github.event.action == 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-preview -->';
            const commentId = ${{ fromJson(steps.find-comment.outputs.result).comment_id }};
            if (commentId) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
              });
            }
