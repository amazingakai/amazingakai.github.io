<div style="padding-top: 10px;">
  <h3 style="margin-top: 0;">Newsletter</h3>
  <p style="font-size: 0.85rem; color: var(--quote-text-color); line-height: 1.4; margin-bottom: 1rem;">
    Subscribe to get email updates whenever I publish new blogs.
  </p>
  <form
    action="https://buttondown.com/api/emails/embed-subscribe/amazingakai"
    method="post"
  >
    <div style="display: flex; flex-direction: column; gap: 0.5rem;">
      <input type="email" name="email" placeholder="Enter your email" required
             style="padding: 0.5rem 0.75rem; border: 1px var(--dim-color) solid; border-radius: 6px; background-color: transparent; color: var(--body-text-color); font-family: inherit; font-size: 0.9rem; transition: border-color 80ms;" />
      <input type="submit" value="Subscribe"
             style="padding: 0.5rem 0.75rem; background-color: var(--primary-color); color: #ffffff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-family: inherit; font-size: 0.9rem; transition: opacity 80ms;" />
    </div>
  </form>
</div>
