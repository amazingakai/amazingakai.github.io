<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="notransition">
  <div id="container">
    <header id="main-header">
      {{- partial "header.html" . -}}
    </header>
    <div class="flex grow">
      <div id="main-pane">
        <main id="main-content">
          {{- block "main" . -}}{{- end -}}
        </main>
        <footer id="main-footer">
          {{- partial "footer.html" . -}}
        </footer>
      </div>
      {{- if (and (default true .Params.rtwt.sidePane) site.Params.rtwt.sidePane) -}}
        {{- block "side" . -}}{{- end -}}
      {{- end -}}
    </div>
  </div>
  <!-- Cloudflare Web Analytics -->
  <script type="module"
    src="https://static.cloudflareinsights.com/beacon.min.js"
    data-cf-beacon='{"token":"ffb706779996433ba82eafd593f12439"}'>
  </script>
  <!-- End Cloudflare Web Analytics -->
</body>
</html>
